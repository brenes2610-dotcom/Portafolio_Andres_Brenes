<!-- Fragmento 1: head de todas las páginas -->
<head th:fragment="head">
    <title>TechShop</title>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="icon" type="image/png" href="/fav/favicon.png"/>
    <link th:href="@{/webjars/bootstrap/css/bootstrap.min.css}" rel="stylesheet"/>
    <link th:href="@{/webjars/font-awesome/css/all.css}" rel="stylesheet"/>
    <script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
</head>

<!-- Fragmento 2: encabezado con menú -->
<header th:fragment="header" class="header">
    <nav class="navbar navbar-expand-sm navbar-dark bg-dark p-0">
        <div class="container">
            <a th:href="@{/}" class="navbar-brand">[[#{aplicacion.titulo}]]</a>
            <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navbarCollapse">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-between" id="navbarCollapse">
                <ul class="navbar-nav">
                    <li class="nav-item px-2"><a class="nav-link" th:href="@{/ejemplo2}">[[#{menu.autos}]]</a></li>
                    <li class="nav-item px-2"><a class="nav-link" th:href="@{/multimedia}">[[#{menu.multimedia}]]</a></li>
                    <li class="nav-item px-2"><a class="nav-link" th:href="@{/iframes}">[[#{menu.iframes}]]</a></li>
                    <li class="nav-item px-2"><a class="nav-link" th:href="@{/categoria/listado}">[[#{menu.categorias}]]</a></li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" data-bs-toggle="dropdown" href="#" role="button">[[#{menu.idioma}]]</a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" th:href="@{/(lang=es)}">Español</a></li>
                            <li><a class="dropdown-item" th:href="@{/(lang=en)}">English</a></li>
                            <li><a class="dropdown-item" th:href="@{/(lang=fr)}">Français</a></li>
                            <li><a class="dropdown-item" th:href="@{/(lang=pt)}">Português</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <section id="main-header" class="py-2 bg-success text-white">
        <div class="container">
            <h1><i class="fas fa-cog"></i> [[#{aplicacion.titulo}]]</h1>
        </div>
    </section>
</header>

<!-- Fragmento 3: footer -->
<footer th:fragment="footer" class="p-2 mt-5 bg-info text-white">
    <p class="lead text-center">[[#{pie.derechos}]] &copy;</p>
</footer>
