<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <body>

        <!-- Fragmento 1: pestañas de categorías -->
        <section th:fragment="tabs" class="py-3">
            <ul class="nav nav-underline justify-content-center">
                <li class="nav-item">
                    <a th:href="@{/}" class="nav-link"
                       th:classappend="${idCategoriaActual == null} ? 'active'">
                        [[#{consultas.todas}]]
                    </a>
                </li>
                <li th:each="c : ${categorias}" class="nav-item">
                    <a class="nav-link"
                       th:href="@{/consultas/{id}(id=${c.idCategoria})}"
                       th:classappend="${idCategoriaActual != null and idCategoriaActual.equals(c.idCategoria)} ? 'active'"
                       th:text="${c.descripcion}"></a>
                </li>
            </ul>
        </section>

        <!-- Fragmento 2: tarjetas de productos -->
        <section th:fragment="tarjetas" class="container py-4">
            <p th:if="${productos == null or productos.empty}" class="text-center text-muted">
                [[#{consultas.vacio}]]
            </p>
            <div class="row row-cols-1 row-cols-md-3 g-4">
                <div th:each="p : ${productos}" class="col">
                    <article class="card h-100 shadow-sm">
                        <img th:if="${!#strings.isEmpty(p.rutaImagen)}"
                             th:src="${p.rutaImagen}" th:alt="${p.descripcion}"
                             class="card-img-top"
                             style="height:200px; object-fit:contain">
                        <div th:if="${p.rutaImagen == null}"
                             class="text-center text-secondary py-5 bg-light">
                            <div th:if="${#strings.isEmpty(p.rutaImagen)}"
                        </div>
                        <div class="card-body">
                            <h5 class="card-title" th:text="${p.descripcion}"></h5>
                            <p class="card-text" th:text="${p.detalle}"></p>
                            <strong th:text="'$' + ${#numbers.formatDecimal(p.precio, 1, 'COMMA', 2, 'POINT')}"></strong>
                            <p class="mb-0 text-muted">
                                [[#{producto.existencias}]]: [[${p.existencias}]]
                            </p>
                        </div>
                    </article>
                </div>
            </div>
        </section>
        <section th:fragment="buscar" class="container py-3">
            <div class="card">
                <div class="card-header bg-info text-white">
                    <h5 class="mb-0">[[#{consultas.buscar.titulo}]]</h5>
                </div>
                <form th:action="@{/consultas/buscar}" method="post" class="card-body">
                    <div class="row g-3 align-items-end">
                        <div class="col-md-5">
                            <label class="form-label">[[#{consultas.palabra}]]</label>
                            <input type="text" name="texto" class="form-control"
                                   th:value="${texto}" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">[[#{consultas.existenciasMinimas}]]</label>
                            <input type="number" name="existenciasMinimas" class="form-control"
                                   min="0" th:value="${existenciasMinimas != null ? existenciasMinimas : 0}" required>
                        </div>
                        <div class="col-md-3">
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="fa-solid fa-magnifying-glass"></i> [[#{consultas.boton}]]
                            </button>
                        </div>
                    </div>
                </form>
            </div>
            <p th:if="${busquedaRealizada}" class="mt-3 text-muted">
                [[#{consultas.resultado}]]: [[${#lists.size(productos)}]]
            </p>
        </section>
    </body>
</html>
