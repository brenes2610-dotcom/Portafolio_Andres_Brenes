<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{general/fragmentos :: head}"/>
    <body>
        <header th:replace="~{general/fragmentos :: header}"/>

        <section class="py-4">
            <div class="container">
                <div class="card">
                    <div class="card-header bg-info text-white">
                        <h4>[[#{producto.modificar}]]</h4>
                    </div>
                    <form th:action="@{/producto/guardar}" th:object="${producto}" method="post">
                        <div class="card-body">
                            <input type="hidden" th:field="*{idProducto}"/>
                            <input type="hidden" name="rutaImagen" th:value="*{rutaImagen}"/>

                            <div class="mb-3">
                                <label class="form-label">[[#{producto.descripcion}]]</label>
                                <input type="text" th:field="*{descripcion}" class="form-control"
                                       maxlength="50" required/>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">[[#{producto.detalle}]]</label>
                                <textarea th:field="*{detalle}" class="form-control" rows="3"></textarea>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">[[#{producto.categoria}]]</label>
                                <select name="idCategoria" class="form-select" required>
                                    <option th:each="c : ${categorias}"
                                            th:value="${c.idCategoria}"
                                            th:text="${c.descripcion}"
                                            th:selected="${c.idCategoria == producto.idCategoria}"></option>
                                </select>
                            </div>
                            <div class="row">
                                <div class="col-6 mb-3">
                                    <label class="form-label">[[#{producto.precio}]]</label>
                                    <input type="number" th:field="*{precio}" class="form-control"
                                           step="0.01" min="0.01" required/>
                                </div>
                                <div class="col-6 mb-3">
                                    <label class="form-label">[[#{producto.existencias}]]</label>
                                    <input type="number" th:field="*{existencias}" class="form-control"
                                           min="0" required/>
                                </div>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="activo"
                                       value="true" id="productoActivo" th:checked="${producto.activo}"/>
                                <label class="form-check-label" for="productoActivo">
                                    [[#{producto.activo}]]
                                </label>
                            </div>
                        </div>
                        <div class="card-footer">
                            <a th:href="@{/producto/listado}" class="btn btn-secondary">
                                <i class="fa-solid fa-arrow-left"></i> [[#{accion.cerrar}]]
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="fa-solid fa-floppy-disk"></i> [[#{accion.guardar}]]
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </section>

        <footer th:replace="~{general/fragmentos :: footer}"/>
    </body>
</html>
