<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8"/>
        <title>Categorías</title>
    </head>
    <body>

        <!-- fragmento 1: botón y ventana modal para agregar (se activa en la semana 4) -->
        <section th:fragment="agregar">
            <div class="container py-3">
                <button type="button" class="btn btn-primary"
                        data-bs-toggle="modal" data-bs-target="#agregarCategoriaModal">
                    <i class="fa-solid fa-plus"></i> [[#{categoria.agregar}]]
                </button>
            </div>
            <div class="modal fade" id="agregarCategoriaModal" tabindex="-1" aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header bg-info text-white">
                            <h1 class="modal-title fs-5">[[#{categoria.agregar}]]</h1>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body">
                            <div class="mb-3">
                                <label>[[#{categoria.descripcion}]]</label>
                                <input type="text" name="descripcion" class="form-control"/>
                            </div>
                            <div class="form-check">
                                <input type="checkbox" name="activo" class="form-check-input"/>
                                <label class="form-check-label">[[#{categoria.activo}]]</label>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                                <i class="fa-solid fa-xmark"></i> [[#{accion.cerrar}]]
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- fragmento 2: listado de categorías -->
        <section th:fragment="listado" class="p-3">
            <div class="container">
                <div class="row">
                    <div class="col-md-9">
                        <div class="card">
                            <div class="card-header bg-info text-white">
                                <h4>[[#{categoria.listado}]]</h4>
                            </div>
                            <div th:if="${categorias != null and !categorias.empty}">
                                <table class="table table-striped table-hover mb-0">
                                    <thead class="table-dark">
                                        <tr>
                                            <th>#</th>
                                            <th>[[#{categoria.descripcion}]]</th>
                                            <th>[[#{categoria.activo}]]</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="c : ${categorias}">
                                            <td>[[${c.idCategoria}]]</td>
                                            <td>[[${c.descripcion}]]</td>
                                            <td>
                                                <i th:class="${c.activo} ? 'fa-solid fa-circle-check text-success' : 'fa-solid fa-circle-xmark text-danger'"></i>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                            <div class="p-3" th:if="${categorias == null or categorias.empty}">
                                [[#{categoria.vacio}]]
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card text-center bg-success text-white">
                            <div class="card-body">
                                <h5>[[#{categoria.total}]]</h5>
                                <h2>[[${totalCategorias}]]</h2>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- fragmentos 3 y 4: se completan en la semana 4 -->
        <section th:fragment="editar"></section>
        <section th:fragment="confirmarEliminar"></section>

    </body>
</html>
