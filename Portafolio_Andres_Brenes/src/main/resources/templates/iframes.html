<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{general/fragmentos :: head}"></head>
    <body>
        <header th:replace="~{general/fragmentos :: header}"></header>
        <section class="container">
            <h2>[[#{iframes.titulo}]]</h2>
            <article>
                <h3>[[#{iframes.sitio}]]</h3>
                <iframe src="https://ufidelitas.ac.cr" height="400" width="800"></iframe>
            </article>
            <article>
                <h3>[[#{iframes.youtube}]]</h3>
                <iframe width="560" height="315"
                        src="https://www.youtube.com/embed/aqz-KE-bpKQ"
                        title="Video de YouTube" allowfullscreen></iframe>
            </article>
            <article>
                <h3>[[#{iframes.mapa}]]</h3>
                <iframe width="600" height="400"
                        src="https://www.google.com/maps?q=San+Jos%C3%A9,+Costa+Rica&output=embed"></iframe>
            </article>
        </section>
        <footer th:replace="~{general/fragmentos :: footer}"></footer>
    </body>
</html>
